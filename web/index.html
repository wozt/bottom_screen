<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bottom Screen</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               font: 14px system-ui, sans-serif; color: #ddd; }
  /* A column, so the buttons sit beside the picture rather than on top
     of it: a control covering the screen you are playing on is worse
     than one that is slightly smaller. */
  body { display: flex; flex-direction: column; }
  #stage { flex: 1 1 auto; display: grid; place-items: center; min-height: 0; }
  canvas { image-rendering: auto; touch-action: none; display: block; }
  /* Above the picture and on its own ground: green text over a bright
     test pattern is unreadable exactly when it matters. */
  #status { position: fixed; left: 12px; top: 10px; color: #7c7;
            font-size: 13px; pointer-events: none; white-space: pre;
            z-index: 10; background: #000000b0; padding: 3px 7px;
            border-radius: 5px; }
  #size { z-index: 10; }
  #servers { position: fixed; right: 12px; top: 44px; z-index: 11;
             background: #14141aee; border: 1px solid #555; border-radius: 8px;
             padding: 8px; display: none; min-width: 210px; }
  #servers.open { display: block; }
  #servers .row2 { display: flex; gap: 6px; align-items: center;
                   margin-bottom: 6px; }
  #servers a { flex: 1; color: #cde; text-decoration: none; font-size: 13px;
               padding: 5px 7px; border-radius: 5px; background: #ffffff12; }
  #servers a:hover { background: #ffffff22; }
  #servers button { background: #ffffff18; color: #ddd; border: 1px solid #555;
                    border-radius: 5px; font-size: 12px; padding: 4px 7px; }
  #servers .hint { color: #888; font-size: 12px; margin: 2px 0 6px; }
  #servers input { width: 100%; box-sizing: border-box; background: #ffffff10;
                   color: #ddd; border: 1px solid #555; border-radius: 5px;
                   padding: 5px 7px; font-size: 13px; margin: 6px 0; }
  #openServers { position: fixed; right: 112px; top: 8px; z-index: 10;
                 background: #ffffff18; color: #ddd; border: 1px solid #555;
                 border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  #size { position: fixed; right: 12px; top: 8px; background: #ffffff18;
          color: #ddd; border: 1px solid #555; border-radius: 6px;
          padding: 4px 6px; font-size: 13px; }
  #pad { flex: 0 0 auto; display: none; align-items: flex-end;
         justify-content: space-between; padding: 10px 14px 18px; gap: 14px; }
  .cluster { display: grid; gap: 10px; justify-items: center; }
  button.b { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #666;
             background: #ffffff28; color: #eee; font-size: 15px;
             touch-action: none; user-select: none; }
  button.b:active { background: #ffffff66; }
  .row { display: flex; gap: 8px; }
  #dpad { display: grid; grid-template-columns: repeat(3, 50px);
          grid-template-rows: repeat(3, 50px); gap: 2px; }
  #dpad button.b { width: 50px; height: 50px; border-radius: 8px; }
  /* The face buttons as the diamond they are on the console, so the
     button under your thumb is where your thumb expects it. */
  .diamond { display: grid; grid-template-columns: repeat(3, 58px);
             grid-template-rows: repeat(3, 58px); gap: 2px; }
  .diamond .top    { grid-area: 1 / 2; }
  .diamond .left   { grid-area: 2 / 1; }
  .diamond .right  { grid-area: 2 / 3; }
  .diamond .bottom { grid-area: 3 / 2; }
</style>

<div id="stage"><canvas id="screen" width="256" height="192"></canvas></div>
<div id="status">connecting…</div>
<button id="openServers" title="Other emulators you have opened">Servers</button>
<div id="servers"></div>
<select id="size" title="How much of the picture to receive">
  <option value="1">Full size</option>
  <option value="2">Half</option>
  <option value="4">Quarter</option>
</select>
<div id="pad"></div>

<script>
"use strict";

/*
 * The same stream the phone and the Switch get, decoded by the browser.
 *
 * No transcoding and no WebRTC: the server already produces H.264, and
 * WebCodecs decodes exactly those bytes -- in hardware where the machine
 * has it. Re-encoding to VP8 for a browser would mean encoding the
 * picture a second time, in software, on the machine that is already
 * running an emulator.
 */

const MSG = { VIDEO: 1, AUDIO: 2, STREAM_INFO: 3,
              INPUT: 16, PING: 17, PONG: 18, REQUEST_KEYFRAME: 19,
              SET_SIZE: 21 };
const INPUT = { TOUCH_DOWN: 1, TOUCH_MOVE: 2, TOUCH_UP: 3,
                BUTTON_DOWN: 4, BUTTON_UP: 5, AXIS: 6 };
const BTN = { A:1, B:2, X:3, Y:4, L:5, R:6, ZL:7, ZR:8,
              START:9, SELECT:10, UP:11, DOWN:12, LEFT:13, RIGHT:14, HOME:15 };

/* The button set each console actually has. Drawing a ZL for a DS would
 * be offering a control that goes nowhere. */
const CONSOLES = {
  1: { name: "Nintendo DS",  shoulders: ["L","R"] },
  2: { name: "Nintendo 3DS", shoulders: ["L","R"] },
  3: { name: "Wii U",        shoulders: ["L","ZL","ZR","R"] },
};

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", { alpha: false });
const statusEl = document.getElementById("status");
const padEl = document.getElementById("pad");

let socket = null, decoder = null;
let width = 256, height = 192, console_id = 1;
let frames = 0, decoded = 0, lastReport = 0, chosenCodec = "";
let audioRate = 0, audioChannels = 0, audioDecoder = null, audioCtx = null;
let audioFrames = 0, nextAudioAt = 0, audioPeak = 0;
/* The size before anybody asked for less, so the fractions below mean
 * fractions of what the emulator renders rather than of each other. */
let fullW = 0, fullH = 0;
let sequence = 0;

let stuck = "";
function say(text) { if (!stuck) statusEl.textContent = text; }
/* Something went wrong and stays wrong: it holds the line, because a
 * frame counter ticking over an error message hides the only thing
 * worth reading. */
function problem(text) { stuck = text; statusEl.textContent = text; }
function consoleName() { return (CONSOLES[console_id] || CONSOLES[1]).name; }

/* ------------------------------------------------------------- sending */

function send(type, payload) {
  if (!socket || socket.readyState !== 1) return;
  const body = payload || new Uint8Array(0);
  const buf = new Uint8Array(8 + body.length);
  const view = new DataView(buf.buffer);
  buf[0] = type;
  view.setUint32(4, body.length, true);
  buf.set(body, 8);
  socket.send(buf);
}

function sendInput(type, code, x, y) {
  const b = new Uint8Array(16);
  const v = new DataView(b.buffer);
  v.setUint32(0, sequence++, true);
  v.setUint32(4, (performance.now() * 1000) & 0xffffffff, true);
  b[8] = type;
  b[9] = code;
  v.setInt16(10, x, true);
  v.setInt16(12, y, true);
  send(MSG.INPUT, b);
}

/*
 * Ask for less than the emulator renders.
 *
 * An emulator at four times its internal resolution puts 1280x960 on
 * the wire for a screen that is 320x240, and a phone showing it in part
 * of its display gains nothing from the extra pixels but pays for all
 * of them.
 *
 * Shared with anyone else watching, because there is one encoder: a
 * size each would mean an encoder each. The server answers with the
 * size it settled on, which is not always the one asked for.
 */
const sizeEl = document.getElementById("size");
sizeEl.addEventListener("change", () => {
  const divisor = parseInt(sizeEl.value, 10);
  const b = new Uint8Array(4);
  const v = new DataView(b.buffer);
  if (divisor > 1 && fullW > 0) {
    v.setUint16(0, Math.max(16, Math.round(fullW / divisor)), true);
    v.setUint16(2, Math.max(16, Math.round(fullH / divisor)), true);
  }
  /* Zero means "follow the source", which is how a client stops
   * asking rather than guessing at the original numbers. */
  send(MSG.SET_SIZE, b);
});

/* --------------------------------------------------------------- sound */

/*
 * Opus, decoded by the browser and handed straight to WebAudio.
 *
 * Each packet is scheduled after the last rather than mixed into a
 * continuous buffer: the server sends one packet per video frame and
 * they already arrive in order, so keeping a running start time is
 * enough and needs no worklet.
 */
function startAudio() {
  if (audioDecoder || !audioRate) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)(
    { sampleRate: 48000, latencyHint: "interactive" });
  nextAudioAt = 0;

  audioDecoder = new AudioDecoder({
    output: (data) => {
      audioFrames++;
      const channels = data.numberOfChannels;
      const buffer = audioCtx.createBuffer(channels, data.numberOfFrames, 48000);
      for (let c = 0; c < channels; c++) {
        const plane = new Float32Array(data.numberOfFrames);
        data.copyTo(plane, { planeIndex: c, format: "f32-planar" });
        buffer.copyToChannel(plane, c);
        /*
         * The loudest sample seen, for the same reason the video has a
         * frame count: a decoder can produce a perfectly well-formed
         * stream of silence, and "832 packets" says nothing about
         * whether any of them carried a sound.
         */
        if (c === 0) {
          for (let i = 0; i < plane.length; i += 16) {
            const v = Math.abs(plane[i]);
            if (v > audioPeak) audioPeak = v;
          }
        }
      }
      data.close();

      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      /*
       * A little ahead of now, so a packet that arrives fractionally
       * late still has somewhere to go. Falling behind resets the
       * schedule rather than piling up: a queue that only grows turns a
       * hiccup into a permanent delay.
       */
      const now = audioCtx.currentTime;
      if (nextAudioAt < now + 0.02) nextAudioAt = now + 0.05;
      src.start(nextAudioAt);
      nextAudioAt += buffer.duration;
    },
    error: (e) => problem("audio: " + e.message),
  });

  /* No description: the server sends bare Opus packets rather than the
   * Ogg encapsulation, which is what WebCodecs takes when none is
   * given. */
  audioDecoder.configure({
    codec: "opus",
    sampleRate: 48000,
    numberOfChannels: audioChannels || 2,
  });
}

function onAudio(payload) {
  if (!audioDecoder || audioDecoder.state !== "configured") return;
  /* Browsers will not make a sound until somebody has touched the page,
   * so the context is nudged awake rather than left silent. */
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  try {
    audioDecoder.decode(new EncodedAudioChunk({
      type: "key",           /* every Opus packet stands alone */
      timestamp: audioFrames * 20000,
      data: payload.subarray(8),
    }));
  } catch (e) {
    problem("audio decode: " + e.message);
  }
}

/* Some browsers only allow sound after a gesture, and this page is one
 * you are going to touch anyway. */
["pointerdown", "keydown"].forEach((ev) =>
  window.addEventListener(ev, () => { if (audioCtx) audioCtx.resume(); },
                          { once: false }));

/* --------------------------------------------------------------- video */

/*
 * The codec string, read out of the stream rather than assumed.
 *
 * WebCodecs takes the profile and level as part of the codec name, and
 * it means them: a hardcoded avc1.42E01E pins level 3.0, which covers a
 * DS screen and silently decodes nothing at all for a GamePad at
 * 854x480 -- or for anything rendered at a raised internal resolution.
 * The three bytes after the SPS NAL header are exactly profile,
 * constraints and level, so they are taken from there.
 */
function codecFromSps(data) {
  for (let i = 0; i + 4 < data.length; i++) {
    const isStart3 = data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1;
    const isStart4 = data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 0 &&
                     data[i + 3] === 1;
    if (!isStart3 && !isStart4) continue;
    const nal = i + (isStart4 ? 4 : 3);
    if (nal + 3 >= data.length) break;
    if ((data[nal] & 0x1f) !== 7) continue;      /* 7 is the SPS */
    const hex = (b) => b.toString(16).padStart(2, "0");
    return "avc1." + hex(data[nal + 1]) + hex(data[nal + 2]) + hex(data[nal + 3]);
  }
  return null;
}

function startDecoder(codec) {
  if (decoder) { try { decoder.close(); } catch (e) {} }
  decoder = new VideoDecoder({
    output: (frame) => {
      decoded++;
      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
      frame.close();
    },
    error: (e) => problem("decoder: " + e.message),
  });
  /*
   * No description, which is what tells WebCodecs the stream is Annex B
   * -- and it is, deliberately: the server does not set
   * AV_CODEC_FLAG_GLOBAL_HEADER, so the parameter sets are repeated in
   * front of every keyframe and a client can start at any of them.
   */
  decoder.configure({ codec, optimizeForLatency: true });
}

function onVideo(payload) {
  const v = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
  const flags = v.getUint16(12, true);
  const keyframe = (flags & 0x01) !== 0;
  const data = payload.subarray(16);

  /*
   * Nothing until a keyframe: it carries the parameter sets the decoder
   * has to be configured from, and a correction to a picture that was
   * never there produces noise rather than an image.
   */
  if (!decoder) {
    if (!keyframe) return;
    const codec = codecFromSps(data);
    if (!codec) { problem("no parameter sets in the keyframe"); return; }
    try {
      startDecoder(codec);
    } catch (e) {
      problem("configure " + codec + ": " + e.message);
      decoder = null;
      return;
    }
    chosenCodec = codec;
  }
  if (decoder.state !== "configured") return;
  if (!keyframe && frames === 0) return;

  frames++;
  try {
    decoder.decode(new EncodedVideoChunk({
      type: keyframe ? "key" : "delta",
      timestamp: frames * 1000,
      data,
    }));
  } catch (e) {
    problem("decode: " + e.message);
  }
}

/* ---------------------------------------------------------------- size */

function resize(w, h) {
  width = w; height = h;
  canvas.width = w; canvas.height = h;
  fit();
}

/*
 * The picture keeps its shape and fills what is available.
 *
 * What is never done is stretching the axes apart; a fractional zoom is
 * fine, and insisting on whole multiples of 256 would throw away a third
 * of a phone screen to keep pixels square that nobody is inspecting.
 */
function fit() {
  const stage = document.getElementById("stage");
  const availW = stage.clientWidth || window.innerWidth;
  const availH = stage.clientHeight || window.innerHeight;
  const scale = Math.min(availW / width, availH / height);
  canvas.style.width = Math.floor(width * scale) + "px";
  canvas.style.height = Math.floor(height * scale) + "px";
}
window.addEventListener("resize", fit);

/* --------------------------------------------------------------- touch */

/*
 * Coordinates go in the space the server announced, not the console's
 * native size: the stream is larger whenever the emulator renders at a
 * higher internal resolution, and dividing by the native size instead
 * puts every tap wrong by exactly that scale.
 */
function pointTo(ev) {
  const r = canvas.getBoundingClientRect();
  const x = Math.round((ev.clientX - r.left) / r.width * width);
  const y = Math.round((ev.clientY - r.top) / r.height * height);
  return [Math.max(0, Math.min(width - 1, x)),
          Math.max(0, Math.min(height - 1, y))];
}

let touching = false;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  touching = true;
  const [x, y] = pointTo(e);
  sendInput(INPUT.TOUCH_DOWN, 0, x, y);
  e.preventDefault();
});
canvas.addEventListener("pointermove", (e) => {
  if (!touching) return;
  const [x, y] = pointTo(e);
  sendInput(INPUT.TOUCH_MOVE, 0, x, y);
});
function liftTouch(e) {
  if (!touching) return;
  touching = false;
  sendInput(INPUT.TOUCH_UP, 0, 0, 0);
}
canvas.addEventListener("pointerup", liftTouch);
canvas.addEventListener("pointercancel", liftTouch);

/* ------------------------------------------------------------- buttons */

function addButton(parent, label, code) {
  const b = document.createElement("button");
  b.className = "b";
  b.textContent = label;
  const down = (e) => { e.preventDefault(); sendInput(INPUT.BUTTON_DOWN, code, 0, 0); };
  const up   = (e) => { e.preventDefault(); sendInput(INPUT.BUTTON_UP, code, 0, 0); };
  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up);
  b.addEventListener("pointerleave", up);
  b.addEventListener("pointercancel", up);
  parent.appendChild(b);
  return b;
}

function buildPad(id) {
  padEl.innerHTML = "";
  const profile = CONSOLES[id] || CONSOLES[1];

  const left = document.createElement("div");
  left.className = "cluster";
  const dpad = document.createElement("div");
  dpad.id = "dpad";
  const cells = [null, BTN.UP, null, BTN.LEFT, null, BTN.RIGHT, null, BTN.DOWN, null];
  const names = ["", "▲", "", "◀", "", "▶", "", "▼", ""];
  cells.forEach((code, i) => {
    if (code === null) { dpad.appendChild(document.createElement("div")); return; }
    addButton(dpad, names[i], code);
  });
  left.appendChild(dpad);

  const right = document.createElement("div");
  right.className = "cluster";
  const shoulders = document.createElement("div");
  shoulders.className = "row";
  profile.shoulders.forEach((n) => addButton(shoulders, n, BTN[n]));

  /* X on top, Y left, A right, B bottom -- the layout every console
     here uses, rather than the order they happen to be listed in. */
  const face = document.createElement("div");
  face.className = "diamond";
  addButton(face, "X", BTN.X).classList.add("top");
  addButton(face, "Y", BTN.Y).classList.add("left");
  addButton(face, "A", BTN.A).classList.add("right");
  addButton(face, "B", BTN.B).classList.add("bottom");

  const menu = document.createElement("div");
  menu.className = "row";
  addButton(menu, "SEL", BTN.SELECT);
  addButton(menu, "STA", BTN.START);
  right.append(shoulders, face, menu);

  padEl.append(left, right);
  padEl.style.display = "flex";
  /* The stage only knows its height once the pad has taken its own, so
   * the picture is sized after the layout has settled. */
  requestAnimationFrame(fit);
}

/* A physical pad, if one is paired: the same codes the on-screen
 * buttons send, so the server cannot tell them apart. */
const GAMEPAD_MAP = [BTN.B, BTN.A, BTN.Y, BTN.X, BTN.L, BTN.R, BTN.ZL, BTN.ZR,
                     BTN.SELECT, BTN.START, 0, 0,
                     BTN.UP, BTN.DOWN, BTN.LEFT, BTN.RIGHT];
let padState = [];
function pollGamepad() {
  const gp = navigator.getGamepads && navigator.getGamepads()[0];
  if (gp) {
    for (let i = 0; i < GAMEPAD_MAP.length && i < gp.buttons.length; i++) {
      const code = GAMEPAD_MAP[i];
      if (!code) continue;
      const now = gp.buttons[i].pressed;
      if (now !== padState[i]) {
        padState[i] = now;
        sendInput(now ? INPUT.BUTTON_DOWN : INPUT.BUTTON_UP, code, 0, 0);
      }
    }
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

/* ------------------------------------------------------------ servers */

/*
 * The other emulators.
 *
 * Each one serves this page on its own port, so moving from the DS to
 * the Wii U is a different address rather than a different setting --
 * and typing one on a phone is exactly the friction worth removing.
 *
 * Kept in this browser, because the list is about which machines you
 * use rather than anything the server knows: an emulator has no
 * business holding a list of its neighbours.
 */
const KEY = "bottom_screen.servers";
const serversEl = document.getElementById("servers");
const openServersEl = document.getElementById("openServers");

function loadServers() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    /* A list that cannot be read is treated as an empty one: nothing
     * here is worth failing a page load over. */
    return [];
  }
}

function saveServers(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
}

/*
 * The list travels with the link.
 *
 * Each emulator serves its page on its own port, and a different port is
 * a different origin, so the browser gives each one its own storage. A
 * list saved on the DS page is invisible from the Wii U page -- which
 * makes a list of the others useless exactly where it was meant to
 * help.
 *
 * So it rides along in the fragment, which the browser never sends to
 * the server, and the page it lands on merges it. After one hop every
 * page knows all of them.
 */
function encodeList(list) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(list)))); }
  catch (e) { return ""; }
}

function mergeFromHash() {
  if (!location.hash.startsWith("#s=")) return;
  try {
    const incoming = JSON.parse(
      decodeURIComponent(escape(atob(location.hash.slice(3)))));
    const mine = loadServers();
    const known = new Set(mine.map((s) => s.host));
    /* Names already chosen here win: the person renamed it for a
     * reason. */
    for (const entry of incoming)
      if (entry && entry.host && !known.has(entry.host)) mine.push(entry);
    saveServers(mine);
  } catch (e) {
    /* A malformed fragment is somebody else's link, not a reason to
     * stop. */
  }
  history.replaceState(null, "", location.pathname);
}
mergeFromHash();

function rememberThisOne() {
  const list = loadServers().filter((s) => s.host !== location.host);
  /* Named after the console, which is only known once the server has
   * answered -- "Wii U (5092)" is worth more than the address it
   * replaces. */
  const name = console_id
    ? consoleName() + " (" + (location.port || "80") + ")"
    : location.host;
  list.push({ name, host: location.host });
  saveServers(list);
  drawServers();
}

function drawServers() {
  const list = loadServers();
  serversEl.innerHTML = "";

  if (!list.length) {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Nothing saved yet.";
    serversEl.appendChild(hint);
  }

  for (const entry of list) {
    const row = document.createElement("div");
    row.className = "row2";

    const link = document.createElement("a");
    link.href = location.protocol + "//" + entry.host + "/#s=" +
                encodeURIComponent(encodeList(list));
    link.textContent = entry.name +
      (entry.host === location.host ? "  (this one)" : "");
    row.appendChild(link);

    const drop = document.createElement("button");
    drop.textContent = "\u00d7";
    drop.title = "Forget";
    drop.addEventListener("click", (e) => {
      e.preventDefault();
      saveServers(loadServers().filter((s) => s.host !== entry.host));
      drawServers();
    });
    row.appendChild(drop);
    serversEl.appendChild(row);
  }

  const add = document.createElement("button");
  add.textContent = loadServers().some((s) => s.host === location.host)
    ? "Rename this one" : "Save this one";
  add.addEventListener("click", rememberThisOne);
  serversEl.appendChild(add);

  /*
   * Adding one you are not on, which is the only way a list ever gets a
   * second entry: "save this one" can only ever describe the page you
   * are reading.
   *
   * A bare number is a port on this machine, because that is the case
   * every time -- three emulators side by side, 5090, 5091, 5092.
   */
  const field = document.createElement("input");
  field.placeholder = "another port, or host:port";
  field.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const typed = field.value.trim();
    if (!typed) return;
    const host = /^\d+$/.test(typed)
      ? location.hostname + ":" + typed
      : typed;
    const list = loadServers().filter((s) => s.host !== host);
    list.push({ name: host, host });
    saveServers(list);
    field.value = "";
    drawServers();
  });
  serversEl.appendChild(field);

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Following a link carries the list along.";
  serversEl.appendChild(hint);
}

openServersEl.addEventListener("click", () => {
  serversEl.classList.toggle("open");
  if (serversEl.classList.contains("open")) drawServers();
});

/* ---------------------------------------------------------- connection */

function connect() {
  if (!("VideoDecoder" in window)) {
    say("this browser has no WebCodecs, so it cannot decode the stream");
    return;
  }

  const url = (location.protocol === "https:" ? "wss://" : "ws://") +
              location.host + "/ws";
  socket = new WebSocket(url);
  socket.binaryType = "arraybuffer";

  socket.onopen = () => say("connected, waiting for the stream…");
  socket.onclose = () => say("disconnected");
  socket.onerror = () => say("connection failed");

  let greeted = false;
  socket.onmessage = (ev) => {
    const bytes = new Uint8Array(ev.data);

    if (!greeted) {
      /* The upgrade was the hello, so the first frame is the answer:
       * the ack, then the parameter sets the decoder wants up front. */
      greeted = true;
      const v = new DataView(bytes.buffer);
      console_id = bytes[6];
      resize(v.getUint16(8, true), v.getUint16(10, true));
      audioChannels = bytes[17];
      audioRate = v.getUint16(18, true);
      if (audioRate > 0 && "AudioDecoder" in window) startAudio();
      if (!fullW) { fullW = width; fullH = height; }
      buildPad(console_id);
      say(consoleName() + "  " + width + "×" + height + ", waiting for a keyframe");
      send(MSG.REQUEST_KEYFRAME);
      return;
    }

    const type = bytes[0];
    const payload = bytes.subarray(8);
    if (type === MSG.VIDEO) {
      onVideo(payload);
      const now = performance.now();
      if (now - lastReport > 1000) {
        say(consoleName() + "  " + width + "×" + height + "  " +
            chosenCodec + "  " + decoded + "/" + frames + " frames" +
            (audioRate ? "  " + audioFrames + " audio, peak " +
                         audioPeak.toFixed(2) : "") +
            /* Decoded and audible are not the same thing: a browser
             * that has not been touched yet suspends the context, and
             * everything still schedules into silence. Saying so beats
             * leaving somebody to wonder. */
            (audioCtx && audioCtx.state !== "running"
               ? "  (tap to allow sound)" : ""));
        lastReport = now;
      }
    } else if (type === MSG.AUDIO) {
      onAudio(payload);
    } else if (type === MSG.STREAM_INFO) {
      const v = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
      resize(v.getUint16(4, true), v.getUint16(6, true));
      if (sizeEl.value === "1") { fullW = width; fullH = height; }
      /* The size changed under the decoder, so its reference picture is
       * worthless whatever it was -- and so is its level, which is why
       * the next keyframe reconfigures rather than this line. */
      if (decoder) { try { decoder.close(); } catch (e) {} }
      decoder = null;
      /* Both counters, or the display reads "3876/454": one restarting
       * beside one that never did says nothing about either. */
      frames = 0;
      decoded = 0;
      send(MSG.REQUEST_KEYFRAME);
    } else if (type === MSG.PING) {
      send(MSG.PONG);
    }
  };
}

connect();
</script>
